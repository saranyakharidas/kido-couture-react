{% extends 'products/base.html' %}
{% block title%}
Signup
{% endblock%} <!-- descriptions -->
{% block content %}
<br>
<br>
<div class="d-flex justify-content-center align-items-center py-5 h-100 mt-5" style="height: 100vh;">
    <div class="border rounded-2xl border-gray-400 p-4  p-3 mb-2 bg-dark text-white" style="border-radius: 24px; max-width: 100%;" >
        <form class="d-flex flex-column align-items-center form" id="signup-form"  action="" method="post" >
    {% csrf_token %}
    <div class="form-outline mb-4">
      <legend>Signup Page</legend>
    </div>
    <!-- Email input -->
    <div class="form-outline mb-4">
      <label class="form-label" for="form2Example1">Username</label>
        <input type="username" id="form2Example1" class="form-control" placeholder="Enter Username" name='username'/>
        
      </div>
      
    <div class="form-outline mb-4">
      <label class="form-label" for="form2Example1">Email</label>
      <input type="email" id="form2Example1" class="form-control" placeholder="Enter email" name='email'/>
      
    </div>
  
    <!-- Password input -->
    <div class="form-outline mb-4">
      <label class="form-label" for="form2Example2">Password</label>
      <input type="password" id="form2Example2" class="form-control" placeholder="password" name='pass1'/>
      <label>(Password must be at least 8 characters long and contain <br> one uppercase letter, one lowercase letter, and one digit)</label>
    </div>

    <div class="form-outline mb-4">
      <label class="form-label" for="form2Example2">Repeat Password</label>
        <input type="password" id="form2Example2" class="form-control" placeholder="Repeat password" name='pass2'/>
      </div>

      <div class="form-outline mb-4">
        <input type="text" id="form2Example17" class="form-control form-control-lg" placeholder="Referral Code" name="referal_code" style="background-color:#F5F7FA;" />
      </div>
  
    <!-- 2 column grid layout for inline styling -->
    <div class="row mb-4">
      <div class="col d-flex justify-content-center">
        <!-- Checkbox -->
        <div class="form-check">
          <input class="form-check-input" type="checkbox" value="" id="form2Example34" checked />
          <label class="form-check-label" for="form2Example34"> Remember me </label>
        </div>
      </div>
  
      <div class="col">
        <!-- Simple link -->
        <a href="#!">Forgot password?</a>
      </div>
    </div>
  
    <!-- Submit button -->
    <button type="submit" class="flex-c-m stext-101 cl0 size-101 bg1 bor1 hov-btn1 p-lr-15 trans-04">Register</button>
  
    <!-- Register buttons -->
    <div class="text-center">
      <p>Already a member? <a href="{% url 'signin' %}">Login</a></p>
      
    </div>
  </form>
    </div>
</div>
<br>

{% endblock %}
