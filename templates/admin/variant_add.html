<style>
  .black-button {

}

<script>
  // Get the custom color from the query parameter
  const queryString = window.location.search;
    const urlParams = new URLSearchParams(queryString);
    const customColor = urlParams.get('customColor');

    // If a custom color is provided, add it to the color variants
    if (customColor) {
        // Create a new <option> element for the custom color and append it to the <select>
        const customColorOption = document.createElement('option');
        customColorOption.value = customColor;
        customColorOption.textContent = customColor;
        document.getElementById('colors').appendChild(customColorOption);

        // Select the custom color in the dropdown
        document.getElementById('colors').value = customColor;

        // Add the custom color to the color variants (assuming you have a CSS class for this)
        const colorVariantElement = document.getElementById('color-variant-element');
        colorVariantElement.classList.add('color-variant-' + customColor);
    }
   document.addEventListener("DOMContentLoaded", function() {
    var colorsSelect = document.getElementById("colors");
    var customColorContainer = document.getElementById("custom-color-container");
    var customColorInput = document.getElementById("custom-color");

    colorsSelect.addEventListener("change", function() {
      if (colorsSelect.value === "other") {
        customColorContainer.style.display = "block";
        customColorInput.required = true;
      } else {
        customColorContainer.style.display = "none";
        customColorInput.required = false;
        customColorInput.value = "";
      }
    });
  });
//   function openNewPage() {
//     // Redirect to the new page for adding a custom color
//     window.location.href = 'add_custom_color.html';
// }
</script>
