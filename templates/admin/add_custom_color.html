<body>
    <h2>Add a Custom Color</h2>
    <form method="post"> <!-- Add method="post" to your form -->
        {% csrf_token %}
        <label for="customColor">Custom Color:</label>
        <input type="text" id="customColor" name="customColor">

        <button type="submit">Add Color</button>
    </form>

    <h3>Existing Colors:</h3>
    <ul>
        {% for color in colors %}
            <li>{{ color.color }}</li>
        {% endfor %}
    </ul>
